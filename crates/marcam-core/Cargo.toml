[package]
name = "marcam-core"
description = "Core of marcam, a 4th-axis rotary CAM engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# tests and benchmarks read the repository's examples and fixtures: not shipped
exclude = ["tests/", "examples/"]

[lib]
name = "marcam"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# (natively) work that splits into independent pieces done on every core
rayon = "1"

[dependencies]
flate2 = "1"
# transcendental functions computed the same on every platform (see src/det.rs)
libm = "0.2"
ruzstd = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# project files are TOML (key order kept as the model gives it)
toml = { version = "0.9", features = ["preserve_order"] }
