# The whole project check (scripts/check.sh) on Linux and Windows: format, lints, Rust tests,
# the C ABI with its C and C# examples, the SolidCraft plugin build, the WebAssembly package
# under Node, the Python wheel, and the web app in headless Chrome. The runners have no GPU
# (the GPU checks fall back to the CPU and say so) and no SolidCraft (its end-to-end step
# skips unless SOLIDCRAFT_CLI is set).
name: CI

# On main (each push), pull requests, every three hours and on demand. A run under way is
# never cancelled: a newer push waits behind it (GitHub keeps only the newest waiting), so the
# full suite always finishes on a recent main. The fast suite (fast.yml) gates the merges.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # the toolchain the project is checked with locally, so new lints arrive on purpose
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: scripts/check.sh
        shell: bash
        env:
          # no GPU on the runners: the web test's 3D view uses Chrome's software WebGL
          MARCAM_E2E_SOFTWARE_GL: "1"
          # STEP import (SolidCraft's kernel) is checked by the step job
          MARCAM_SKIP_STEP: "1"
          # shared runners: the long-task budget sixteen times looser (software GL draws on the page's thread too; frames not timed)
          MARCAM_PERF_SLACK: "16"
        run: |
          set -o pipefail
          sh scripts/check.sh 2>&1 | tee check.log
      # (diagnostic) how long the knob plans here, natively and as WebAssembly in Node: the
      # Windows runner has taken over two minutes for it in the browser, seconds elsewhere
      - name: knob timing
        if: always()
        shell: bash
        run: |
          cargo build -q --release -p marcam-cli --bin marcam || true
          node scripts/knob-timing.mjs --notice --browser || true
      # the log's end as an annotation: readable on the run's page (and through the API)
      # without downloading the logs
      - name: report the failure
        if: failure()
        shell: bash
        run: |
          # what failed (every FAIL and error line), then how it ended; long lines cut
          msg=$( { grep -E '^(FAIL|error|Error)|panicked|^thread|Node\.js v' check.log | head -n 40; echo "--- the end:"; tail -n 25 check.log; } | tr -d '\r' | cut -c1-300 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=check.sh failed::${msg}"
      - name: keep the log and the web screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.os }}
          path: |
            check.log
            web/tests/screenshots/
          if-no-files-found: ignore

  # STEP import: SolidCraft's kernel, which cargo fetches from its GitHub repository at the
  # revision pinned in crates/marcam-step/Cargo.toml (scripts/check-step.sh)
  step:
    name: STEP import
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: step
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: where SolidCraft comes from
        shell: bash
        run: grep -n "solidcraft" crates/marcam-step/Cargo.toml
      - name: scripts/check-step.sh
        shell: bash
        env:
          MARCAM_E2E_SOFTWARE_GL: "1"
        run: |
          set -o pipefail
          sh scripts/check-step.sh 2>&1 | tee check-step.log
          # the kernel was fetched from GitHub, at the pinned revision
          grep -n 'source = "git+https://github.com/tangency-labs/solidcraft' Cargo.lock | head -3
      - name: report the failure
        if: failure()
        shell: bash
        run: |
          msg=$( { grep -E '^(FAIL|error|Error)|panicked|^thread|Node\.js v' check-step.log | head -n 40; echo "--- the end:"; tail -n 25 check-step.log; } | tr -d '\r' | cut -c1-300 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=check-step.sh failed::${msg}"
      - name: keep the log and the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-step
          path: |
            check-step.log
            web/tests/screenshots/step_*
          if-no-files-found: ignore
